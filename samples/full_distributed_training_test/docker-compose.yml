version: "3.8"

networks:
  public-net:
    driver: bridge
  c:
    driver: bridge
  t1:
    driver: bridge
  t2:
    driver: bridge

services:
  relay:
    build:
      context: ../../src/bootstrap-relay
    networks:
      - public-net
      - c
      - t1
      - t2
    ports:
      - "4001:4001"
      - "4001:4001/udp"
      - "8090:8090"
    environment:
      - P2P_RELAY_LISTEN_TCP=/ip4/0.0.0.0/tcp/4001
      - P2P_RELAY_LISTEN_QUIC=/ip4/0.0.0.0/udp/4001/quic-v1
      - P2P_RELAY_LISTEN_HTTP=8090
      - P2P_RELAY_IDENTITY_PATH=/tmp/relay.key
      - P2P_RELAY_LOG_LEVEL=debug
      - P2P_RELAY_MAX_RELAYED_BYTES=1073741824
      - P2P_RELAY_MAX_RELAY_DURATION=30m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8090/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 1s

  coordinator:
    build:
      context: ../../src/Coordinator
      dockerfile: TrainSwarm.Coordinator.Api/Dockerfile
    networks:
      - public-net
      - c
      - t1
      - t2
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - COORDINATOR_HTTP_PORT=8080
      - COORDINATOR_GRPC_PORT=8081
      - COORDINATOR_DB_CONNECTION_STRING=Data Source=/data/coordinator.db
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - coordinator-data:/data

  client-p2p:
    build:
      context: ../../src/p2p-node
    networks:
      - c
    environment:
      - RELAY_HOST=relay
      - RELAY_PORT=4001
      - RELAY_HTTP_PORT=8090
      - P2P_PORT=9000
      - GRPC_PORT=50051
      - WORKING_DIR=/artifacts
    volumes:
      - client-artifacts:/artifacts
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50051 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  client:
    build:
      context: ../../src/Client
    networks:
      - c
    environment:
      - P2P_GRPC_HOST=client-p2p
      - P2P_GRPC_PORT=50051
      - TRAINING_CLIENT_DB_PATH=/data/training.db
      - TRAINING_WORKING_DIRECTORY=/artifacts
      - TRAINING_CLIENT_WORKING_DIRECTORY=/artifacts
      - WORKING_DIR=/artifacts
      - COORDINATOR_ADDRESS=http://coordinator:8080
    volumes:
      - client-data:/data
      - client-artifacts:/artifacts
      - ./artifacts:/seed_artifacts:ro
    depends_on:
      client-p2p:
        condition: service_healthy
    stdin_open: true
    tty: true

  trainer1-p2p:
    build:
      context: ../../src/p2p-node
    networks:
      - t1
    environment:
      - RELAY_HOST=relay
      - RELAY_PORT=4001
      - RELAY_HTTP_PORT=8090
      - P2P_PORT=9000
      - GRPC_PORT=50051
      - WORKING_DIR=/artifacts
    volumes:
      - trainer1-artifacts:/artifacts
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50051 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  trainer-1:
    build:
      context: ../../src/Trainer
    networks:
      - t1
    environment:
      - P2P_GRPC_HOST=trainer1-p2p
      - P2P_GRPC_PORT=50051
      - TRAINER_WORKING_DIRECTORY=/artifacts
      - WORKING_DIR=/artifacts
      - COORDINATOR_ADDRESS=http://coordinator:8080
      - COORDINATOR_GRPC_ADDRESS=coordinator:8081
      - TRAINER_NODE_ID=trainer-node-01
    volumes:
      - trainer1-artifacts:/artifacts
    depends_on:
      trainer1-p2p:
        condition: service_healthy
    stdin_open: true
    tty: true

  trainer2-p2p:
    build:
      context: ../../src/p2p-node
    networks:
      - t2
    environment:
      - RELAY_HOST=relay
      - RELAY_PORT=4001
      - RELAY_HTTP_PORT=8090
      - P2P_PORT=9000
      - GRPC_PORT=50051
      - WORKING_DIR=/artifacts
    volumes:
      - trainer2-artifacts:/artifacts
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50051 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  trainer-2:
    build:
      context: ../../src/Trainer
    networks:
      - t2
    environment:
      - P2P_GRPC_HOST=trainer2-p2p
      - P2P_GRPC_PORT=50051
      - TRAINER_WORKING_DIRECTORY=/artifacts
      - WORKING_DIR=/artifacts
      - COORDINATOR_ADDRESS=http://coordinator:8080
      - COORDINATOR_GRPC_ADDRESS=coordinator:8081
      - TRAINER_NODE_ID=trainer-node-02
    volumes:
      - trainer2-artifacts:/artifacts
    depends_on:
      trainer2-p2p:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  coordinator-data:
  client-data:
  client-artifacts:
  trainer1-artifacts:
  trainer2-artifacts:
