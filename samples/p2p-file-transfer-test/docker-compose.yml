networks:
  nat-a:
    driver: bridge
  nat-b:
    driver: bridge

services:
  relay:
    build:
      context: ../../src/bootstrap-relay
    ports:
      - "4001:4001"
      - "4001:4001/udp"
      - "8090:8090"
    environment:
      - P2P_RELAY_LISTEN_TCP=/ip4/0.0.0.0/tcp/4001
      - P2P_RELAY_LISTEN_QUIC=/ip4/0.0.0.0/udp/4001/quic-v1
      - P2P_RELAY_LISTEN_HTTP=8090
      - P2P_RELAY_IDENTITY_PATH=/tmp/relay.key
      - P2P_RELAY_LOG_LEVEL=debug
      - P2P_RELAY_MAX_RELAYED_BYTES=1073741824
      - P2P_RELAY_MAX_RELAY_DURATION=30m

  node-a:
    build:
      context: ../../src/p2p-node
    networks:
      - nat-a
    ports:
      - "50051:50051"
    environment:
      - RELAY_HOST=host.docker.internal
      - RELAY_PORT=4001
      - RELAY_HTTP_PORT=8090
      - P2P_PORT=9000
      - GRPC_PORT=50051
    extra_hosts:
      - "host.docker.internal:host-gateway"

  node-b:
    build:
      context: ../../src/p2p-node
    networks:
      - nat-b
    ports:
      - "50052:50052"
    environment:
      - RELAY_HOST=host.docker.internal
      - RELAY_PORT=4001
      - RELAY_HTTP_PORT=8090
      - P2P_PORT=9000
      - GRPC_PORT=50052
    extra_hosts:
      - "host.docker.internal:host-gateway"
