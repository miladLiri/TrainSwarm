syntax = "proto3";

package p2p.v1;

option go_package = "internal/api/p2pv1";

// Service implemented by the Go p2p-node standalone sidecar executable.
// Exposes a localhost-bound gRPC interface to Python applications.
service P2PNode {
  // --- Node & Connection Management ---
  rpc GetNodeInfo(GetNodeInfoRequest) returns (GetNodeInfoResponse);
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
  rpc GetConnectionStatus(GetConnectionStatusRequest) returns (GetConnectionStatusResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream NodeEvent);

  // --- Base File Transfer RPCs ---
  rpc SendFile(SendFileRequest) returns (stream TransferEvent);
  rpc AcceptFile(AcceptFileRequest) returns (stream TransferEvent);
  rpc CancelTransfer(CancelTransferRequest) returns (CancelTransferResponse);
  rpc GetTransferStatus(GetTransferStatusRequest) returns (TransferStatusResponse);
  rpc RequestFile(RequestFileRequest) returns (RequestFileResponse);

  // --- Trainer P2P High-Level Workflows ---
  // Step 1: Request training task specification from Client
  rpc GetTrainingTask(GetTrainingTaskRequest) returns (GetTrainingTaskResponse);

  // Step 2: Request base model checkpoint from Client (streams over P2P, saves to working dir)
  rpc GetModel(GetModelRequest) returns (GetModelResponse);

  // Step 3: Request assigned dataset shard from Client (streams over P2P, saves to working dir)
  rpc GetShard(GetShardRequest) returns (GetShardResponse);

  // Step 4: Stream trained weights delta and metadata back to Client
  rpc SendUpdate(SendUpdateRequest) returns (SendUpdateResponse);

  // --- Client Inbound Request Dispatch ---
  // Long-lived bidirectional stream for Client Python adapter to receive inbound
  // requests arriving over libp2p and return command handler execution outputs.
  rpc ServeClientRequests(stream ClientActionResponse) returns (stream ClientActionRequest);
}

// --- Enums ---

enum Reachability {
  REACHABILITY_UNKNOWN = 0;
  REACHABILITY_PUBLIC = 1;
  REACHABILITY_PRIVATE = 2;
  REACHABILITY_RELAY_ONLY = 3;
}

enum ConnectionState {
  STATE_DISCONNECTED = 0;
  STATE_CONNECTING = 1;
  STATE_RELAY_CONNECTED = 2;
  STATE_PUNCHING = 3;
  STATE_DIRECT_CONNECTED = 4;
  STATE_FAILED = 5;
}

enum EventType {
  EVENT_UNKNOWN = 0;
  EVENT_PEER_CONNECTED = 1;
  EVENT_PEER_DISCONNECTED = 2;
  EVENT_CONNECTION_UPGRADED_TO_DIRECT = 3;
  EVENT_HOLE_PUNCH_FAILED = 4;
  EVENT_TRANSFER_REQUESTED = 5;
  EVENT_TRANSFER_STARTED = 6;
  EVENT_TRANSFER_PROGRESS = 7;
  EVENT_TRANSFER_COMPLETED = 8;
  EVENT_TRANSFER_FAILED = 9;
  EVENT_TRANSFER_CANCELLED = 10;
  EVENT_FILE_REQUESTED = 11;
}

enum ClientActionType {
  ACTION_UNKNOWN = 0;
  ACTION_GET_TRAINING_TASK = 1;
  ACTION_TRANSFER_MODEL = 2;
  ACTION_TRANSFER_SHARD = 3;
  ACTION_UPDATE_MODEL = 4;
}

// --- Base Messages ---

message GetNodeInfoRequest {}

message GetNodeInfoResponse {
  string peer_id = 1;
  repeated string listen_addresses = 2;
  repeated string relay_addresses = 3;
  Reachability reachability = 4;
  string grpc_api_version = 5;
}

message ConnectRequest {
  string peer_id = 1;
  int32 timeout_ms = 2;
}

message ConnectResponse {
  string connection_id = 1;
  string peer_id = 2;
  ConnectionState state = 3;
  string transport = 4;
  bool direct = 5;
  string relay_address = 6;
  string error = 7;
}

message DisconnectRequest {
  string peer_id = 1;
}

message DisconnectResponse {
  bool success = 1;
}

message GetConnectionStatusRequest {
  string peer_id = 1;
}

message GetConnectionStatusResponse {
  string peer_id = 1;
  string connection_id = 2;
  ConnectionState state = 3;
  bool direct = 4;
  string transport = 5;
  repeated string remote_addresses = 6;
  int64 connected_at = 7;
  int64 last_activity = 8;
}

message WatchEventsRequest {}

message NodeEvent {
  EventType type = 1;
  string peer_id = 2;
  string transfer_id = 3;
  string message = 4;
  TransferMetadata metadata = 5;
}

message TransferMetadata {
  string file_name = 1;
  int64 file_size = 2;
  string sha256 = 3;
}

message SendFileRequest {
  string transfer_id = 1;
  string peer_id = 2;
  string file_name = 3;
  int64 file_size = 4;
  string sha256 = 5;
  string source_path = 6;
  bool overwrite = 7;
}

message AcceptFileRequest {
  string transfer_id = 1;
  string destination_path = 2;
  bool overwrite = 3;
}

message TransferEvent {
  string transfer_id = 1;
  EventType state = 2;
  int64 bytes_transferred = 3;
  int64 total_bytes = 4;
  int64 speed_bps = 5;
  float progress = 6;
  string error = 7;
}

message CancelTransferRequest {
  string transfer_id = 1;
}

message CancelTransferResponse {
  bool success = 1;
}

message GetTransferStatusRequest {
  string transfer_id = 1;
}

message TransferStatusResponse {
  string transfer_id = 1;
  EventType state = 2;
  int64 bytes_transferred = 3;
  int64 total_bytes = 4;
}

message RequestFileRequest {
  string peer_id = 1;
  string file_name = 2;
}

message RequestFileResponse {
  bool success = 1;
}

// --- Trainer Workflow Messages ---

message GetTrainingTaskRequest {
  string client_peer_id = 1;
  string model_id = 2;
  string model_version = 3;
  string data_set_id = 4;
  string shard_id = 5;
}

message GetTrainingTaskResponse {
  bool success = 1;
  string error = 2;
  string training_task_json = 3;
}

message GetModelRequest {
  string client_peer_id = 1;
  string model_id = 2;
  string model_version = 3;
}

message GetModelResponse {
  bool success = 1;
  string error = 2;
  string local_file_path = 3;
}

message GetShardRequest {
  string client_peer_id = 1;
  string model_id = 2;
  string model_version = 3;
  string data_set_id = 4;
  string shard_id = 5;
}

message GetShardResponse {
  bool success = 1;
  string error = 2;
  string local_file_path = 3;
}

message SendUpdateRequest {
  string client_peer_id = 1;
  string training_result_json = 2;
  string update_artifact_path = 3;
}

message SendUpdateResponse {
  bool success = 1;
  string error = 2;
}

// --- Client Action Dispatch Messages ---

message ClientActionRequest {
  string request_id = 1;
  ClientActionType action_type = 2;
  string trainer_peer_id = 3;
  string model_id = 4;
  string model_version = 5;
  string dataset_id = 6;
  string shard_id = 7;
  string training_result_json = 8;
  string saved_update_path = 9;
}

message ClientActionResponse {
  string request_id = 1;
  bool success = 2;
  string error = 3;
  string training_task_json = 4;
  string file_path = 5;
}
